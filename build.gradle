plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"basic-storage" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

processResources {
	inputs.property "mod_version", project.mod_version
	inputs.property "mod_id", project.mod_id
	inputs.property "mod_name", project.mod_name
	inputs.property "mod_description", project.mod_description
	inputs.property "mod_author", project.mod_author
	inputs.property "mod_homepage", project.mod_homepage
	inputs.property "mod_sources", project.mod_sources
	inputs.property "mod_issues", project.mod_issues
	inputs.property "mod_license", project.mod_license
	inputs.property "mod_icon", project.mod_icon
	inputs.property "main_class", project.main_class
	inputs.property "client_class", project.client_class
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "fabric_loader_version", project.fabric_loader_version
	inputs.property "fabric_version", project.fabric_version
	inputs.property "java_version", project.java_version

	filesMatching("fabric.mod.json") {
		expand(
			"mod_version": project.mod_version,
			"mod_id": project.mod_id,
			"mod_name": project.mod_name,
			"mod_description": project.mod_description,
			"mod_author": project.mod_author,
			"mod_homepage": project.mod_homepage,
			"mod_sources": project.mod_sources,
			"mod_issues": project.mod_issues,
			"mod_license": project.mod_license,
			"mod_icon": project.mod_icon,
			"main_class": project.main_class,
			"client_class": project.client_class,
			"minecraft_version": project.minecraft_version,
			"fabric_loader_version": project.fabric_loader_version,
			"fabric_version": project.fabric_version,
			"java_version": project.java_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}