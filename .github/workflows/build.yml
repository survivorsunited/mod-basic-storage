# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: install PowerShell Core
        uses: microsoft/setup-powershell@v1
        with:
          pwsh-version: 'latest'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: |
          ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - name: upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.mc_version }}-java${{ matrix.java }}
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
          retention-days: 7
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: extract version and create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.8'
        shell: pwsh
        run: |
          Write-Host "🚀 Starting release process..."
          
          # Extract version
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $fullVersion = $Matches[1].Trim()
              if ($fullVersion -match '^(\d+\.\d+\.\d+)') {
                  $version = $Matches[1]
              } else {
                  $version = $fullVersion
              }
              Write-Host "Version: $version"
          } else {
              Write-Host "❌ ERROR: Could not extract version"
              exit 1
          }
          
          # Check if tag exists
          $tagExists = git rev-parse "$version" 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Tag $version already exists, skipping release"
              exit 0
          }
          
          # Verify JAR exists
          $jarFiles = Get-ChildItem -Path "build/libs" -Filter "basicstorage-*.jar" -Exclude "*-sources.jar", "*-dev.jar"
          if ($jarFiles.Count -eq 0) {
              Write-Host "❌ ERROR: No JAR files found"
              exit 1
          }
          Write-Host "✅ Found $($jarFiles.Count) JAR file(s)"
          
          # Create tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"
          Write-Host "✅ Tag $version created and pushed"
          
          # Create release using GitHub CLI
          $jarPath = $jarFiles[0].FullName
          $jarName = $jarFiles[0].Name
          Write-Host "Creating release with JAR: $jarName"
          
          $releaseBody = @"
## Basic Storage $version

Built for Minecraft ${{ matrix.mc_version }}

### Changes
- See commit history for details

### Installation
1. Download the JAR file below
2. Place it in your `mods` folder
3. Requires Fabric Loader and Fabric API
"@
          
          gh release create "$version" --title "Release $version" --notes "$releaseBody" "$jarPath" --repo "${{ github.repository }}"
          Write-Host "✅ Release $version created successfully"
