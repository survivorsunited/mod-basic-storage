name: build
on:
  pull_request:
  push:
    branches:
      - 1.21.8
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        id: build_step
        run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: debug workflow conditions
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== WORKFLOW DEBUG ==="
          Write-Host "Event name: ${{ github.event_name }}"
          Write-Host "Ref: ${{ github.ref }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Build outcome: ${{ steps.build_step.outcome }}"
      - name: extract version
        if: github.event_name == 'push' && steps.build_step.outcome == 'success'
        shell: pwsh
        id: version
        run: |
          Write-Host "=== EXTRACTING VERSION ==="
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $full = $Matches[1].Trim()
              if ($full -match '^(\d+\.\d+\.\d+)') {
                  $ver = $Matches[1]
              } else {
                  $ver = $full
              }
              Write-Host "Extracted version: $ver"
              "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Version written to output"
          } else {
              Write-Host "ERROR: Could not extract version"
              exit 1
          }
      - name: debug version step
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "=== VERSION STEP DEBUG ==="
          Write-Host "Version step outcome: ${{ steps.version.outcome }}"
          Write-Host "Version output: ${{ steps.version.outputs.version }}"
      - name: list JAR files
        if: github.event_name == 'push' && steps.version.outcome == 'success'
        shell: pwsh
        run: |
          Write-Host "=== JAR FILES ==="
          if (Test-Path "build/libs") {
            $jars = Get-ChildItem -Path "build/libs" -Filter "*.jar"
            Write-Host "Found $($jars.Count) JAR files:"
            $jars | ForEach-Object { Write-Host "  - $($_.FullName)" }
            if ($jars.Count -eq 0) {
              Write-Host "ERROR: No JAR files found!"
              exit 1
            }
          } else {
            Write-Host "ERROR: build/libs directory does not exist!"
            exit 1
          }
      - name: debug release conditions
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "=== RELEASE CONDITIONS DEBUG ==="
          Write-Host "Event name: ${{ github.event_name }}"
          Write-Host "Version outcome: ${{ steps.version.outcome }}"
          Write-Host "Version value: ${{ steps.version.outputs.version }}"
          if ("${{ steps.version.outcome }}" -eq "success" -and "${{ steps.version.outputs.version }}" -ne "") {
            Write-Host "✅ Conditions met for release"
          } else {
            Write-Host "❌ Conditions NOT met for release"
          }
      - name: create and push tag
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.version.outputs.version != ''
        id: tag_step
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "ERROR: TAG is empty!"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fetch existing tags first
          git fetch origin --tags 2>&1 || true
          # Check if tag already exists
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            git tag -a "$TAG" -m "Release $TAG"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin "$TAG"
            echo "Tag $TAG created and pushed"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: filter JAR files for release
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.version.outputs.version != '' && steps.tag_step.outcome == 'success'
        shell: pwsh
        id: filter_jars
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Write-Host "Filtering JAR files for version: $version"
          $jars = Get-ChildItem -Path "build/libs" -Filter "*.jar" | Where-Object { $_.Name -match "basicstorage-$version" }
          if ($jars) {
            $jarPaths = $jars | ForEach-Object { $_.FullName } | Sort-Object
            Write-Host "Found matching JAR files:"
            $jarPaths | ForEach-Object { Write-Host "  - $_" }
            # Output as newline-separated list for the action
            $jarList = $jarPaths -join "`n"
            "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $jarList | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "ERROR: No JAR files found matching version $version"
            exit 1
          }
      - name: create release
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.version.outputs.version != '' && steps.tag_step.outcome == 'success' && steps.filter_jars.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            Built for Minecraft ${{ matrix.mc_version }}
          files: ${{ steps.filter_jars.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
