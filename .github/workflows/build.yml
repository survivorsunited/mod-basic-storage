name: build
on:
  pull_request:
  push:
    branches:
      - 1.21.8
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - uses: microsoft/setup-powershell@v1
      - run: chmod +x ./gradlew
      - name: build
        id: build_step
        run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: extract version
        if: github.event_name == 'push' && steps.build_step.outcome == 'success'
        shell: pwsh
        id: version
        run: |
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $full = $Matches[1].Trim()
              if ($full -match '^(\d+\.\d+\.\d+)') {
                  $ver = $Matches[1]
              } else {
                  $ver = $full
              }
              Write-Host "Version: $ver"
              "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
              Write-Host "ERROR: Could not extract version"
              exit 1
          }
      - name: list JAR files
        if: github.event_name == 'push' && steps.version.outcome == 'success'
        shell: pwsh
        run: |
          Write-Host "=== JAR FILES ==="
          if (Test-Path "build/libs") {
            $jars = Get-ChildItem -Path "build/libs" -Filter "*.jar"
            Write-Host "Found $($jars.Count) JAR files:"
            $jars | ForEach-Object { Write-Host "  - $($_.FullName)" }
            if ($jars.Count -eq 0) {
              Write-Host "ERROR: No JAR files found!"
              exit 1
            }
          } else {
            Write-Host "ERROR: build/libs directory does not exist!"
            exit 1
          }
      - name: create release
        if: github.event_name == 'push' && steps.version.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            Built for Minecraft ${{ matrix.mc_version }}
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
