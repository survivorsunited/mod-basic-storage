name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - uses: microsoft/setup-powershell@v1
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: create release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $full = $Matches[1].Trim()
              if ($full -match '^(\d+\.\d+\.\d+)') {
                  $ver = $Matches[1]
              } else {
                  $ver = $full
              }
              
              if (git rev-parse "$ver" 2>&1) {
                  Write-Host "Tag $ver exists, skipping"
                  exit 0
              }
              
              $jars = Get-ChildItem build/libs -Filter "basicstorage-*.jar" -Exclude "*-sources.jar","*-dev.jar"
              if ($jars.Count -eq 0) {
                  Write-Host "No JAR files found"
                  exit 1
              }
              
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$ver" -m "Release $ver"
              git push origin "$ver"
              
              $body = "## Basic Storage $ver`n`nBuilt for Minecraft ${{ matrix.mc_version }}"
              gh release create "$ver" --title "Release $ver" --notes "$body" $jars[0].FullName
          } else {
              Write-Host "Could not extract version"
              exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
