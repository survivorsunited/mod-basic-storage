name: build
on:
  pull_request:
  push:
    branches:
      - 1.21.8
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - uses: microsoft/setup-powershell@v1
      - run: chmod +x ./gradlew
      - name: build
        id: build_step
        run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: debug workflow conditions
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== WORKFLOW DEBUG ==="
          Write-Host "Event name: ${{ github.event_name }}"
          Write-Host "Ref: ${{ github.ref }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Build outcome: ${{ steps.build_step.outcome }}"
      - name: extract version
        if: github.event_name == 'push' && steps.build_step.outcome == 'success'
        shell: pwsh
        id: version
        run: |
          Write-Host "=== EXTRACTING VERSION ==="
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $full = $Matches[1].Trim()
              if ($full -match '^(\d+\.\d+\.\d+)') {
                  $ver = $Matches[1]
              } else {
                  $ver = $full
              }
              Write-Host "Extracted version: $ver"
              "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Version written to output"
          } else {
              Write-Host "ERROR: Could not extract version"
              exit 1
          }
      - name: debug version step
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "=== VERSION STEP DEBUG ==="
          Write-Host "Version step outcome: ${{ steps.version.outcome }}"
          Write-Host "Version output: ${{ steps.version.outputs.version }}"
      - name: list JAR files
        if: github.event_name == 'push' && steps.version.outcome == 'success'
        shell: pwsh
        run: |
          Write-Host "=== JAR FILES ==="
          if (Test-Path "build/libs") {
            $jars = Get-ChildItem -Path "build/libs" -Filter "*.jar"
            Write-Host "Found $($jars.Count) JAR files:"
            $jars | ForEach-Object { Write-Host "  - $($_.FullName)" }
            if ($jars.Count -eq 0) {
              Write-Host "ERROR: No JAR files found!"
              exit 1
            }
          } else {
            Write-Host "ERROR: build/libs directory does not exist!"
            exit 1
          }
      - name: debug release conditions
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "=== RELEASE CONDITIONS DEBUG ==="
          Write-Host "Event name: ${{ github.event_name }}"
          Write-Host "Version outcome: ${{ steps.version.outcome }}"
          Write-Host "Version value: ${{ steps.version.outputs.version }}"
          if ("${{ steps.version.outcome }}" -eq "success" -and "${{ steps.version.outputs.version }}" -ne "") {
            Write-Host "✅ Conditions met for release"
          } else {
            Write-Host "❌ Conditions NOT met for release"
          }
      - name: create release with gh CLI
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.version.outputs.version != ''
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          JAR_NAME=$(basename "$JAR_FILE")
          
          echo "=== CREATING RELEASE ==="
          echo "Version: $VERSION"
          echo "JAR: $JAR_FILE"
          
          # Create tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin "$VERSION" || echo "Tag push failed or tag already exists"
          
          # Try using gh CLI if available
          if command -v gh &> /dev/null; then
            echo "Using GitHub CLI..."
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes "## Basic Storage $VERSION
          Built for Minecraft ${{ matrix.mc_version }}" \
              "$JAR_FILE" \
              --repo "${{ github.repository }}"
          else
            echo "GitHub CLI not available, using action..."
            # Fallback to action
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create release with action (fallback)
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.version.outputs.version != '' && steps.create_release_with_gh_cli.outcome == 'failure'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            Built for Minecraft ${{ matrix.mc_version }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
