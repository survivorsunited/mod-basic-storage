name: build
on:
  pull_request:
  push:
    branches:
      - 1.21.8

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - uses: microsoft/setup-powershell@v1
      - run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: extract version
        if: github.event_name == 'push'
        shell: pwsh
        id: version
        run: |
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $full = $Matches[1].Trim()
              if ($full -match '^(\d+\.\d+\.\d+)') {
                  $ver = $Matches[1]
              } else {
                  $ver = $full
              }
              Write-Host "Version: $ver"
              "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
              Write-Host "ERROR: Could not extract version"
              exit 1
          }
      - name: check if tag exists
        if: github.event_name == 'push' && steps.version.outcome == 'success'
        shell: bash
        id: tag_check
        run: |
          TAG="${{ steps.version.outputs.version }}"
          git fetch origin --tags 2>&1 | true
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist"
          fi
      - name: create tag
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create release
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            Built for Minecraft ${{ matrix.mc_version }}
          files: build/libs/basicstorage-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
