name: build

on:
  pull_request:
  push:
    branches:
      - latest-stable
  workflow_dispatch:

jobs:
  build-12111:
    name: Build Minecraft 1.21.11
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          MC_VERSION=$(grep '^[[:space:]]*minecraft_version[[:space:]]*=' gradle.properties | sed 's/^[[:space:]]*minecraft_version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')
          MOD_VERSION=$(grep '^[[:space:]]*mod_version[[:space:]]*=' gradle.properties | sed 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')
          echo "Minecraft version: $MC_VERSION"
          echo "Mod version: $MOD_VERSION"
          if [ "$MC_VERSION" != "1.21.11" ]; then
            echo "Only Minecraft 1.21.11 is enabled for latest-stable builds." >&2
            exit 1
          fi

      - name: Patch source for Minecraft 1.21.11
        run: python3 scripts/patch-1.21.11-compat.py

      - name: Build 1.21.11 jar
        run: ./gradlew clean build --no-daemon

      - name: Upload build libs
        uses: actions/upload-artifact@v4
        with:
          name: basic-storage-1.21.11-build-libs
          path: build/libs/
          retention-days: 30
