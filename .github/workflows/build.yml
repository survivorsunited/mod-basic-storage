# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
        # Use these Minecraft versions for testing
        mc_version: [
          "1.21.8",
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: install PowerShell Core
        uses: microsoft/setup-powershell@v1
        with:
          pwsh-version: 'latest'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: run version bump test
        shell: pwsh
        run: |
          ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: false
      - name: debug workflow conditions
        if: ${{ matrix.java == '21' }}
        run: |
          echo "🔍 Debugging workflow conditions:"
          echo "  Event name: ${{ github.event_name }}"
          echo "  Ref: ${{ github.ref }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Java version: ${{ matrix.java }}"
          echo "  MC version: ${{ matrix.mc_version }}"
          echo "  Should run release: ${{ matrix.java == '21' && github.event_name == 'push' && github.ref == 'refs/heads/1.21.8' }}"
          echo ""
          echo "🔍 Condition breakdown:"
          echo "  matrix.java == '21': ${{ matrix.java == '21' }}"
          echo "  github.event_name == 'push': ${{ github.event_name == 'push' }}"
          echo "  github.ref == 'refs/heads/1.21.8': ${{ github.ref == 'refs/heads/1.21.8' }}"
          echo "  Combined: ${{ matrix.java == '21' && github.event_name == 'push' && github.ref == 'refs/heads/1.21.8' }}"
      - name: upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.mc_version }}-java${{ matrix.java }}
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
          retention-days: 7
      - name: capture build artifacts
        if: ${{ matrix.java == '21' }} # Only upload artifacts built from latest java
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: extract version from gradle.properties
        if: ${{ matrix.java == '21' && github.event_name == 'push' && (github.ref == 'refs/heads/1.21.8' || github.ref_name == '1.21.8') }}
        shell: pwsh
        id: version
        run: |
          Write-Host "Extracting version from gradle.properties..."
          $props = Get-Content gradle.properties -Raw
          Write-Host "gradle.properties content preview: $($props.Substring(0, [Math]::Min(200, $props.Length)))"
          
          if ($props -match 'mod_version=([^\r\n]+)') {
              $fullVersion = $Matches[1].Trim()
              Write-Host "Full version from gradle.properties: $fullVersion"
              
              # Extract version without Minecraft version suffix (e.g., 1.1.7+1.21.8 -> 1.1.7)
              # Pattern matches: digits.digits.digits (e.g., 1.1.7)
              if ($fullVersion -match '^(\d+\.\d+\.\d+)') {
                  $version = $Matches[1]
                  "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                  "full_version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                  Write-Host "✅ Extracted version: $version (full: $fullVersion)"
              } else {
                  # Fallback: use full version if pattern doesn't match
                  "version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                  "full_version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                  Write-Host "⚠️ Using full version (pattern didn't match): $fullVersion"
              }
          } else {
              Write-Host "❌ ERROR: Could not extract version from gradle.properties"
              Write-Host "gradle.properties content:"
              Write-Host $props
              exit 1
          }
      - name: check if tag exists
        if: ${{ matrix.java == '21' && github.event_name == 'push' && (github.ref == 'refs/heads/1.21.8' || github.ref_name == '1.21.8') && steps.version.outcome == 'success' }}
        id: tag_check
        run: |
          TAG="${{ steps.version.outputs.version }}"
          echo "Checking if tag exists: $TAG"
          if [ -z "$TAG" ]; then
            echo "❌ ERROR: Version tag is empty"
            echo "Version step outputs:"
            echo "  version: ${{ steps.version.outputs.version }}"
            echo "  full_version: ${{ steps.version.outputs.full_version }}"
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG does not exist, will create release"
          fi
      - name: create git tag
        if: ${{ matrix.java == '21' && github.event_name == 'push' && (github.ref == 'refs/heads/1.21.8' || github.ref_name == '1.21.8') && steps.tag_check.outputs.exists == 'false' && steps.version.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: verify JAR files exist
        if: ${{ matrix.java == '21' && github.event_name == 'push' && (github.ref == 'refs/heads/1.21.8' || github.ref_name == '1.21.8') && steps.tag_check.outputs.exists == 'false' && steps.version.outcome == 'success' }}
        id: verify_jar
        run: |
          echo "📦 Checking for JAR files in build/libs:"
          if [ ! -d "build/libs" ]; then
            echo "❌ ERROR: build/libs directory does not exist"
            exit 1
          fi
          
          echo "📦 All files in build/libs:"
          ls -la build/libs/ || true
          
          echo ""
          echo "📦 Looking for basicstorage JAR files:"
          JAR_COUNT=$(find build/libs -name "basicstorage-*.jar" -type f ! -name "*-sources.jar" ! -name "*-dev.jar" | wc -l)
          echo "Found $JAR_COUNT JAR file(s)"
          
          if [ "$JAR_COUNT" -eq "0" ]; then
            echo "❌ ERROR: No basicstorage JAR files found"
            echo "Available files:"
            ls -la build/libs/ || true
            exit 1
          fi
          
          echo "✅ JAR files found, proceeding with release"
          find build/libs -name "basicstorage-*.jar" -type f ! -name "*-sources.jar" ! -name "*-dev.jar"
      - name: create GitHub release
        if: ${{ matrix.java == '21' && github.event_name == 'push' && (github.ref == 'refs/heads/1.21.8' || github.ref_name == '1.21.8') && steps.tag_check.outputs.exists == 'false' && steps.version.outcome == 'success' && steps.verify_jar.outcome == 'success' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            
            Built for Minecraft ${{ matrix.mc_version }}
            
            ### Changes
            - See commit history for details
            
            ### Installation
            1. Download the JAR file below
            2. Place it in your `mods` folder
            3. Requires Fabric Loader and Fabric API
          files: |
            build/libs/basicstorage-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}