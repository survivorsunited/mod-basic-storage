name: build
on:
  pull_request:
  push:
    branches:
      - 1.21.8
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [21]
        mc_version: ["1.21.8", "1.21.9", "1.21.10", "1.21.11"]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: set gradle.properties for ${{ matrix.mc_version }}
        shell: pwsh
        run: |
          $mc = "${{ matrix.mc_version }}"
          $props = Get-Content gradle.properties -Raw
          # Extract base version (e.g. 2.0.8 from 2.0.8+1.21.8)
          if ($props -match 'mod_version=(\d+\.\d+\.\d+)') { $base = $Matches[1] } else { $base = "0.0.0" }
          $props = $props -replace 'minecraft_version=.*', "minecraft_version=$mc"
          $props = $props -replace 'mod_version=.*', "mod_version=$base+$mc"
          $versionsPath = "versions.json"
          if (Test-Path $versionsPath) {
            $v = Get-Content $versionsPath -Raw | ConvertFrom-Json
            if ($v.minecraft.PSObject.Properties[$mc]) {
              $entry = $v.minecraft.$mc
              if ($entry.yarn_mappings) { $props = $props -replace 'yarn_mappings=.*', "yarn_mappings=$($entry.yarn_mappings)" }
              if ($entry.fabric_version) { $props = $props -replace 'fabric_version=.*', "fabric_version=$($entry.fabric_version)" }
              if ($entry.loom_version) { $props = $props -replace 'loom_version=.*', "loom_version=$($entry.loom_version)" }
            }
          }
          Set-Content -Path gradle.properties -Value $props -NoNewline
          Write-Host "Set gradle.properties for Minecraft $mc (mod_version=$base+$mc)"
      - name: build
        id: build_step
        run: ./gradlew build
      - name: Test server startup
        if: success()
        run: |
          MC_VERSION="${{ matrix.mc_version }}"
          LOADER_VERSION=$(grep "^loader_version=" gradle.properties | cut -d'=' -f2)
          JAR_FILE=$(find build/libs -name "basicstorage-*+${MC_VERSION}.jar" ! -name "*sources*" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found for $MC_VERSION, skipping server test"
            exit 0
          fi
          echo "Testing server startup with mod for Minecraft $MC_VERSION (loader $LOADER_VERSION)"
          FABRIC_INSTALLER_URL="https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.0/fabric-installer-1.0.0.jar"
          curl -fsSL -o fabric-installer.jar "$FABRIC_INSTALLER_URL" || { echo "Fabric installer download failed, skipping server test"; exit 0; }
          mkdir -p test-server
          cd test-server
          java -jar ../fabric-installer.jar server -mcversion "$MC_VERSION" -loader "$LOADER_VERSION" -downloadMinecraft || { echo "Fabric installer failed, skipping server test"; cd ..; exit 0; }
          mkdir -p mods
          cp "../$JAR_FILE" mods/
          echo "eula=true" > eula.txt
          java -Xmx1G -Xms1G -jar server.jar nogui > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            sleep 2
            if grep -q "Done" server.log 2>/dev/null; then
              echo "Server started successfully for $MC_VERSION"
              grep -qi "basicstorage\|basic storage" server.log 2>/dev/null && echo "Mod loaded" || echo "Mod load check inconclusive"
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
              cd ..
              exit 0
            fi
          done
          echo "Server did not start within 60s"
          tail -n 80 server.log
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          cd ..
          exit 1
      - name: run version bump test
        shell: pwsh
        run: ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.mc_version }}
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc_version }}
          path: build/libs/*.jar
      - name: debug workflow conditions
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== WORKFLOW DEBUG ==="
          Write-Host "Event name: ${{ github.event_name }}"
          Write-Host "Ref: ${{ github.ref }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "MC version: ${{ matrix.mc_version }}"
          Write-Host "Build outcome: ${{ steps.build_step.outcome }}"

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: extract base version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=(\d+\.\d+\.\d+)') {
            $base = $Matches[1]
            Write-Host "Base version: $base"
            "version=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "ERROR: Could not extract base version"
            exit 1
          }
      - name: download all JAR artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: release-jars
          merge-multiple: true
      - name: list JARs for release
        shell: pwsh
        run: |
          Get-ChildItem -Path release-jars -Recurse -Filter "*.jar" | ForEach-Object { Write-Host $_.FullName }
          $jars = Get-ChildItem -Path release-jars -Recurse -Filter "*.jar"
          if ($jars.Count -eq 0) {
            Write-Host "ERROR: No JAR files to release"
            exit 1
          }
      - name: create and push tag
        id: tag_step
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "ERROR: TAG is empty!"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags 2>&1 || true
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            git tag -a "$TAG" -m "Release $TAG"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin "$TAG"
            echo "Tag $TAG created and pushed"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            Built for Minecraft 1.21.8, 1.21.9, 1.21.10, 1.21.11
          files: release-jars/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
