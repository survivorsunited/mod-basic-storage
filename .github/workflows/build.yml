# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        mc_version: ["1.21.8"]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: install PowerShell Core
        uses: microsoft/setup-powershell@v1
        with:
          pwsh-version: 'latest'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: debug branch and event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Should release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/1.21.8' }}"
      - name: run version bump test
        shell: pwsh
        run: |
          ./tests/002-version-bump.ps1 -MinecraftVersion "${{ matrix.mc_version }}"
        continue-on-error: true
      - name: upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.mc_version }}-java${{ matrix.java }}
          path: |
            tests/test-output/**/*.log
            tests/results/*.log
          retention-days: 7
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: extract version
        if: github.event_name == 'push'
        shell: pwsh
        id: version
        run: |
          $props = Get-Content gradle.properties -Raw
          if ($props -match 'mod_version=([^\r\n]+)') {
              $fullVersion = $Matches[1].Trim()
              if ($fullVersion -match '^(\d+\.\d+\.\d+)') {
                  $version = $Matches[1]
              } else {
                  $version = $fullVersion
              }
              "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "Version: $version"
          } else {
              Write-Host "❌ ERROR: Could not extract version"
              exit 1
          }
      - name: check tag exists
        if: github.event_name == 'push' && steps.version.outcome == 'success'
        id: tag_check
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag does not exist"
          fi
      - name: create tag and release
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create GitHub release
        if: github.event_name == 'push' && steps.version.outcome == 'success' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Basic Storage ${{ steps.version.outputs.version }}
            
            Built for Minecraft ${{ matrix.mc_version }}
            
            ### Installation
            1. Download the JAR file below
            2. Place it in your `mods` folder
            3. Requires Fabric Loader and Fabric API
          files: build/libs/basicstorage-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
